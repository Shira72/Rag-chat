<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>צ'אט הוראות תכ"ם</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="chat-page">
  <header class="topbar">
    <div>
      <h1>צ'אט הוראות תכ"ם</h1>
      <p class="subtitle">התשובות מבוססות רק על המסמכים שנקלטו, עם קישור לסעיף המקור</p>
    </div>
    <button id="new-chat" class="secondary" type="button">שיחה חדשה</button>
  </header>

  <main id="messages" class="messages" aria-live="polite">
    <div class="empty-state" id="empty-state">
      <p>אפשר לשאול למשל:</p>
      <button class="example" type="button">תוך כמה ימים צריך לשלם לספק?</button>
      <button class="example" type="button">מי צריך לבדוק חשבון לפני תשלום?</button>
      <button class="example" type="button">מה כתוב בסעיף 2.12 בהוראה 1.4.3?</button>
    </div>
  </main>

  <form id="composer" class="composer">
    <textarea id="question" rows="1" maxlength="1000" placeholder="כתבו שאלה..." aria-label="שאלה"></textarea>
    <button id="send" type="submit">שליחה</button>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
